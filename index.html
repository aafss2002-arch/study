:root{--navy:#1B2A41;--navy2:#24375A;--teal:#1F7A72;--teal2:#2A9D8F;--tealbg:#E4F2EF;--sand:#E9DCC4;--sand2:#F6F0E4;--ink:#26323F;--mute:#6B7684;--coral:#B4553F;--coralbg:#F8ECE7;--line:#E2E7EA;--gold:#D9A441}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Thmanyah Sans",system-ui,sans-serif;background:var(--navy);color:var(--ink);font-size:17px;line-height:1.7;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;padding:20px 16px 24px}
.scr.on{display:flex}
/* home */
#home{color:#fff}
.hk{color:#A9BCD0;font-size:14px}
.ht{font-family:"Thmanyah Serif";font-weight:900;font-size:36px;line-height:1.25;margin:6px 0 4px}
.hs{color:var(--sand);font-size:15px}
.bar{width:60px;height:5px;border-radius:5px;background:var(--teal2);margin:14px 0 18px}
.best{display:flex;gap:10px;margin-bottom:18px}
.best div{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.best b{display:block;font-size:22px;font-weight:900;color:#fff;line-height:1.2}
.best span{font-size:12.5px;color:#A9BCD0}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:12px;text-align:right;background:#fff;border-radius:16px;padding:14px 14px;color:var(--navy);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.mode i{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:900;color:#fff;background:var(--teal2)}
.mode .tx{flex:1}.mode b{display:block;font-size:17px;font-weight:900;line-height:1.3}.mode span{font-size:13px;color:var(--mute)}
.mode em{font-style:normal;font-size:12px;color:var(--teal);background:var(--tealbg);border-radius:20px;padding:2px 9px;font-weight:700;white-space:nowrap}
.mode.all i{background:var(--gold)}.mode.wr i{background:var(--coral)}
.mode[disabled]{opacity:.45;pointer-events:none}
.foot{margin-top:auto;padding-top:18px;text-align:center;color:#7F93AA;font-size:12.5px}
/* play */
#play{background:var(--sand2);padding:0}
.top{background:var(--navy);color:#fff;padding:12px 16px 14px;position:sticky;top:0;z-index:3}
.tr{display:flex;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:18px}
.prog{flex:1;height:10px;background:rgba(255,255,255,.14);border-radius:10px;overflow:hidden}
.prog div{height:100%;width:0;background:var(--teal2);border-radius:10px;transition:width .3s}
.sc{display:flex;gap:6px;align-items:center;font-weight:900;font-size:15px}
.streak{color:var(--gold);font-size:14px;font-weight:900;min-width:40px;text-align:left}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:#A9BCD0;margin-top:6px}
.body{padding:18px 16px 130px;flex:1}
.kind{display:inline-block;font-size:12.5px;font-weight:700;color:var(--teal);background:#fff;border:1px solid #CFE6E1;border-radius:20px;padding:1px 10px;margin-bottom:10px}
.q{font-size:20px;font-weight:700;color:var(--navy);line-height:1.6;margin-bottom:16px}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border-radius:16px;padding:16px 10px;font-size:19px;font-weight:900;background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:0 4px 0 #D6DCE0;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D6DCE0}
.opts{display:grid;gap:10px}
.op{display:flex;align-items:center;gap:10px;text-align:right;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 12px;font-size:16.5px;color:var(--ink);box-shadow:0 3px 0 #D6DCE0}
.op i{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #C3CBD1;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px;color:var(--mute)}
.mc .op i{border-radius:8px}
.op.sel{border-color:var(--navy);background:#EEF2F8}.op.sel i{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ok,.op.ok{border-color:var(--teal2);background:var(--tealbg);color:var(--teal)}
.op.ok i{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.no,.op.no{border-color:var(--coral);background:var(--coralbg);color:var(--coral)}
.op.no i{background:var(--coral);border-color:var(--coral);color:#fff}
.op.miss{border-style:dashed;border-color:var(--teal2)}
.locked .op,.locked .btn{pointer-events:none}
.hint{font-size:13px;color:var(--mute);margin:-6px 0 12px}
.reveal{background:#fff;border:2px dashed #C9D3D9;border-radius:16px;padding:18px;text-align:center;color:var(--mute);font-weight:700}
.ansbox{background:#fff;border-right:5px solid var(--teal2);border-radius:14px;padding:14px;font-size:16.5px;line-height:1.85}
.selfg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
/* feedback sheet */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:5;transform:translateY(110%);transition:transform .25s ease}
.fb.on{transform:none}
.fbi{max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px 18px;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.fb.good .fbi{background:#D9F0EB}.fb.bad .fbi{background:#F9E1DA}
.fbt{font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.fb.good .fbt{color:var(--teal)}.fb.bad .fbt{color:var(--coral)}
.fbm{font-size:15.5px;color:var(--ink);margin:4px 0 12px;line-height:1.7}
.fbm .nt{display:block;font-size:13.5px;color:var(--mute);margin-top:4px}
.go{width:100%;border-radius:16px;padding:14px;font-size:18px;font-weight:900;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.fb.good .go{background:var(--teal)}.fb.bad .go{background:var(--coral)}
.check{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 18px;background:linear-gradient(180deg,rgba(246,240,228,0),var(--sand2) 30%);z-index:4}
.check button{display:block;max-width:528px;margin:0 auto;width:100%;border-radius:16px;padding:14px;font-size:18px;font-weight:900;background:var(--navy);color:#fff;box-shadow:0 4px 0 #0E1726}
.check button[disabled]{background:#B8C1C8;box-shadow:0 4px 0 #9AA4AC}
/* end */
#end{color:#fff;text-align:center;align-items:center}
.ring{width:170px;height:170px;margin:26px auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:900}
.et{font-family:"Thmanyah Serif";font-weight:900;font-size:28px;margin-top:6px}
.es{color:#A9BCD0;margin-bottom:18px}
.stats{display:flex;gap:10px;width:100%;margin-bottom:18px}
.stats div{flex:1;background:rgba(255,255,255,.07);border-radius:14px;padding:10px}
.stats b{display:block;font-size:24px;font-weight:900}
.stats span{font-size:12.5px;color:#A9BCD0}
.eb{display:grid;gap:10px;width:100%}
.eb button{border-radius:16px;padding:14px;font-size:17px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.b1{background:var(--coral);color:#fff}.b2{background:var(--teal2);color:#fff}.b3{background:#fff;color:var(--navy)}
.wl{width:100%;text-align:right;margin-top:18px}
.wl h4{font-size:15px;color:var(--sand);margin-bottom:8px}
.wi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.7}
.wi b{color:#8FD6CB;font-weight:700}

#home{position:relative;overflow:hidden;padding-top:0}
.hero{position:relative;margin:0 -16px 6px;padding:22px 16px 18px;overflow:hidden}
.hero svg.waves{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:120px;opacity:.9;pointer-events:none}
.hero svg.ant{position:absolute;left:14px;top:18px;width:62px;height:96px;opacity:.95}
.hk,.ht,.hs{position:relative;z-index:1}
.ht{white-space:nowrap;font-size:clamp(25px,7.6vw,40px)!important;margin:10px 0 6px!important}
.hs{font-size:16px!important}
.mode{flex-wrap:wrap}
.mode .mb{flex-basis:100%;display:flex;align-items:center;gap:8px;margin-top:6px;padding-right:56px}
.mode .mb div{flex:1;height:6px;border-radius:6px;background:#E8ECEF;overflow:hidden}
.mode .mb div i{display:block;height:100%;width:0;background:var(--teal2);border-radius:6px}
.mode .mb span{font-size:11.5px;color:var(--mute);white-space:nowrap}
.mode.every{border:2px solid var(--teal2)}.mode.every i{background:linear-gradient(135deg,var(--teal2),var(--teal));font-size:24px}
.restart{background:none;color:#A9BCD0;font-family:inherit;font-size:13.5px;text-decoration:underline;padding:2px 0 6px;margin-top:-4px}
.mode.exam i{background:var(--navy)}
.mode.exam{border:2px solid var(--gold)}
.timer{font-weight:900;font-size:15px;color:#fff;background:rgba(255,255,255,.12);border-radius:10px;padding:3px 9px;min-width:58px;text-align:center;display:none}
.timer.on{display:block}.timer.low{background:var(--coral)}
.op.pick,.btn.pick{border-color:var(--navy);background:#E9EEF6}
.op.pick i{background:var(--navy);border-color:var(--navy);color:#fff}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.hero svg.ant{z-index:0}
@media (max-width:385px){.hero svg.ant{opacity:.3}}
.etime{color:#A9BCD0;font-size:14px;margin-top:-10px;margin-bottom:14px}

.hero-btn{display:flex;flex-wrap:wrap;align-items:center;gap:12px;width:100%;text-align:right;background:linear-gradient(135deg,#2A9D8F,#1F7A72);color:#fff;border-radius:20px;padding:18px 18px 16px;box-shadow:0 5px 0 #145750;margin-bottom:8px}
.hero-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #145750}
.hb-t{flex:1}.hb-t b{display:block;font-size:24px;font-weight:900;line-height:1.3}.hb-t span{font-size:13.5px;opacity:.9;line-height:1.5;display:block;margin-top:2px}
.hero-btn>i{font-style:normal;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--teal);display:grid;place-items:center;font-size:22px;flex:none}
.hb-p{flex-basis:100%;display:flex;align-items:center;gap:10px;margin-top:4px}
.hb-p div{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}.hb-p div i{display:block;height:100%;background:#fff;border-radius:8px}
.hb-p span{font-size:12.5px;white-space:nowrap}
.restart{display:block;margin:0 auto 6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.duo button{background:#fff;border-radius:16px;padding:12px 10px;text-align:center;color:var(--navy);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.duo button:active{transform:translateY(3px)}
.duo i{font-style:normal;display:block;font-size:20px;line-height:1.2}.duo b{display:block;font-size:16px;font-weight:900}.duo span{font-size:12px;color:var(--mute)}
.duo button[disabled]{opacity:.5}
.secs{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;margin-bottom:16px;overflow:hidden}
.secs summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-weight:700;color:#fff;font-size:15.5px}
.secs summary::-webkit-details-marker{display:none}
.secs em{font-style:normal;transition:transform .2s}.secs[open] em{transform:rotate(180deg)}
#seclist{display:grid;gap:8px;padding:0 10px 10px}
.sec{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:9px 10px;text-align:right;color:var(--navy)}
.sec>i{font-style:normal;flex:none;width:34px;height:34px;border-radius:9px;background:var(--teal2);color:#fff;display:grid;place-items:center;font-weight:900}
.sec>div{flex:1}.sec b{font-size:14.5px;font-weight:900;display:block}
.sp{display:flex;align-items:center;gap:8px;margin-top:3px}.sp div{flex:1;height:5px;border-radius:5px;background:#E8ECEF;overflow:hidden}.sp div i{display:block;height:100%;background:var(--teal2)}.sp span{font-size:11px;color:var(--mute)}
.best{margin-top:4px}.best div{padding:8px 10px}.best b{font-size:18px}
.bar{display:none}
.fb:not(.on){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}

#rounds{color:#fff}
.rh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.x2{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:20px;flex:none}
.rh b{display:block;font-family:"Thmanyah Serif";font-weight:900;font-size:24px;line-height:1.3}
.rh span{font-size:13px;color:#A9BCD0}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:#fff;border-radius:18px;padding:14px 12px 12px;text-align:center;color:var(--navy);box-shadow:0 4px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent}
.rc:active{transform:translateY(3px)}
.rn{width:44px;height:44px;border-radius:50%;background:var(--sand2);display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--navy)}
.rc b{font-size:16px;font-weight:900}
.rc .st{color:var(--gold);font-size:17px;letter-spacing:2px;line-height:1.2}
.rp{width:100%;height:6px;border-radius:6px;background:#E8ECEF;overflow:hidden;margin-top:4px}.rp i{display:block;height:100%;background:var(--teal2)}
.rc small{font-size:12px;color:var(--mute)}
.rc.next{border-color:var(--teal2);box-shadow:0 4px 0 #145750}.rc.next .rn{background:var(--teal2);color:#fff}.rc.next small{color:var(--teal);font-weight:700}
.rc.full .rn{background:var(--teal);color:#fff}
.bigstars{color:var(--gold);font-size:30px;letter-spacing:4px}

.live{display:none;text-align:center;font-size:12.5px;color:#A9BCD0;margin:18px 0 -6px}
.live.on{display:block}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3DDC97;margin-inline-end:7px;vertical-align:1px;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:lp 2s infinite}
@keyframes lp{70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .3s}.shake{animation:shake .3s}
</style></head><body><div class="app">

</div>

function lock(){$('#qb').classList.add('locked')}
function examNext(x,ok){x&&x.classList.add('pick');lock();record(ok);setTimeout(next,450)}
function answerTF(x){const q=st.list[st.i];const v=x.dataset.v==='1';const ok=v===q.ans;
  if(st.exam)return examNext(x,ok);lock();

function checkMC(){const q=st.list[st.i];const c=new Set(q.c);const ok=c.size===st.sel.size&&[...c].every(x=>st.sel.has(x));$('#chk').style.display='none';

function record(ok){const q=st.list[st.i];
  if(ok){st.score++;st.streak++;st.best=Math.max(st.best,st.streak);wrongBank=wrongBank.filter(k=>k!==key(q));if(!okBank.includes(key(q)))okBank.push(key(q))}
  else{st.streak=0;st.wrong.push(q);if(!wrongBank.includes(key(q)))wrongBank.push(key(q));okBank=okBank.filter(k=>k!==key(q))}
  store.set('wrong',wrongBank);store.set('ok',okBank)}
const GOOD=['ممتاز!','أحسنت!','صح عليك!','كفو!','تمام!'],BAD=['قريبة!','ركّز معها','راجعها'];

function next(){$('#fb').className='fb';st.i++;if(st.i<st.list.length)render();else end()}
function end(timeout){
  stopTimer();
  const answered=st.exam?st.i+(timeout?0:0):st.list.length;
  if(timeout){for(let j=st.i;j<st.list.length;j++)st.wrong.push(st.list[j])}

  if(st.ridx!==null){const R=rounds(),i=st.ridx,RSt=store.get('rstars',{});

    const full=mast(R[i])===R[i].length;if(full&&!st.wrong.length)$('#et').textContent='أتقنت الجولة '+(i+1)+'!';

    $('#hm').textContent='خريطة الجولات'}
  show('end');if(p>=90)confetti();
}
function confetti(){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#2A9D8F','#D9A441','#E9DCC4','#fff','#B4553F'];const P=Array.from({length:130},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,v:2+Math.random()*3.5,s:Math.random()*6.28,w:.05+Math.random()*.1,c:cols[Math.floor(Math.random()*5)]}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.s+=p.w;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.s)*12,p.y);x.rotate(p.s);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
  if(t-t0<2600)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0)}
